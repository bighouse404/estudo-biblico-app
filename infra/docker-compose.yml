version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: estudobiblico-db
    environment:
      POSTGRES_DB: estudobiblico
      POSTGRES_USER: estudobiblico
      POSTGRES_PASSWORD: estudobiblico123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
